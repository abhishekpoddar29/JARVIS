[project]
name = "jarvis-backend"
version = "0.2.0"
description = "FastAPI and LangGraph backend for Jarvis 2.0."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "websockets>=14",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "langgraph>=0.4",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-mcp-adapters>=0.1",
    "google-genai>=1.30",
    "mcp>=1.9",
    "redis>=5.2",
    "chromadb>=0.6",
    "google-api-python-client>=2.160",
    "google-auth>=2.38",
    "google-auth-oauthlib>=1.2",
    "cryptography>=44",
    "httpx>=0.28",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "playwright>=1.50",
    "psutil>=6.1",
    "GitPython>=3.1",
    "e2b-code-interpreter>=1.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
